name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, cpp]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - app/build/**
              - app/schemas/**

      # --no-build-cache forces the compiler to actually run instead of replaying FROM-CACHE task outputs, since CodeQL's extractor works by observing compiler invocations during the build, see https://gh.io/troubleshooting-code-scanning/no-source-code-seen-during-build (reason 4, "cached components not detected")
      - name: Build project for CodeQL
        run: ./gradlew :app:assembleDebug --no-build-cache

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  codeql-summary:
    name: CodeQL summary
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      pull-requests: write
      security-events: read
    steps:
      - name: Write job summary
        run: echo "## CodeQL analysis complete for java-kotlin and cpp. Findings, if any, are in Security → Code scanning alerts, this job only confirms the scan ran." >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 CodeQL Complete\nFindings (if any) appear in **Security → Code scanning alerts**.\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
